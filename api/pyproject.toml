[project]
name = "travelin-api"
version = "0.1.0"
description = "Travelin API: trip state, ADK agent workflows, and settlement logic"
requires-python = ">=3.12"
dependencies = [
    "ap2",
    "fastapi>=0.141.1",
    "firebase-admin>=7.7.0",
    "google-adk>=2.12.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "pyjwt[crypto]>=2.15.1",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    # ap2 pins pytest==9.0.2 as a runtime dependency, so keep this range loose.
    "pytest>=9.0",
    "ruff>=0.17.0",
]

[tool.uv.sources]
ap2 = { git = "https://github.com/google-agentic-commerce/AP2.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
